<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- TrackHub mark (light variant, for the dark icon background), same geometry as the
     portal's logo-th.svg. Resizetizer draws this layer edge to edge, and Android shows only
     the central 72/108 of it, which magnifies the artwork by ~1.5x: the padded viewBox puts
     it at 38% of the canvas so the launcher renders it at ~58% of the visible circle, with
     the dial on appicon.svg breathing around it. -->
<svg width="456" height="456" viewBox="-71 -71 342 342" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- Central Hub -->
  <circle cx="100" cy="100" r="30" fill="#FFFFFF" />

  <!-- Shortened Spokes -->
  <line x1="100" y1="70" x2="100" y2="40" stroke="#FFFFFF" stroke-width="4"/>
  <line x1="130" y1="100" x2="160" y2="100" stroke="#FFFFFF" stroke-width="4"/>
  <line x1="100" y1="130" x2="100" y2="160" stroke="#FFFFFF" stroke-width="4"/>
  <line x1="70" y1="100" x2="40" y2="100" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Tracking Symbol -->
  <circle cx="100" cy="100" r="10" fill="#1E90FF" />
  <circle cx="100" cy="100" r="5" fill="#FFFFFF" />

  <!-- Connected Dots -->
  <circle cx="100" cy="40" r="5" fill="#FFFFFF" />
  <circle cx="160" cy="100" r="5" fill="#FFFFFF" />
  <circle cx="100" cy="160" r="5" fill="#FFFFFF" />
  <circle cx="40" cy="100" r="5" fill="#FFFFFF" />
</svg>
