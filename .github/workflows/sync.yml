name: sync
on:
  schedule: [{cron: '0 6 * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh repo sync ${{ github.repository }} -b main
          gh repo sync ${{ github.repository }} -b develop
        env:
          # GITHUB_TOKEN cannot merge upstream changes to .github/workflows; SYNC_TOKEN needs the workflow permission.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
